name: Portfolio quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: sudo apt-get update && sudo apt-get install -y libxml2-utils
      - run: npm run check:bpmn
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
        env:
          BUILDFLOW_UI_DB: /tmp/buildflow-ui-ci.sqlite
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prototype-screenshots
          path: 14-demo/screenshots/*.png
